# ==========================================================
# DIGITAL ENVIRONMENT TWIN - APPLICATION CONFIGURATION
# ==========================================================

server.port=9090

# Primary MySQL DataSource
spring.datasource.url=jdbc:mysql://localhost:3306/digital_twin_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Logging
logging.level.com.digitaltwin.environment=INFO
logging.level.org.springframework.web=INFO
